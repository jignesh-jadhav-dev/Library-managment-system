<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <div class="card card-md">
        <h2 class="center">Book List</h2>

        <p class="empty" th:if="${#lists.isEmpty(books)}">No books available.</p>

        <div class="book" th:each="book : ${books}">
            <a class="book-title" th:href="@{/books/{id}(id=${book.id})}" th:text="${book.title}">Title</a>
            <p class="book-author"><strong>Author:</strong> <span th:text="${book.author}">Author</span></p>
            <div class="book-actions">
                <a th:href="@{/books/edit/{id}(id=${book.id})}">Update</a>
            </div>
        </div>

        <div class="link-center">
            <a th:href="@{/}">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
