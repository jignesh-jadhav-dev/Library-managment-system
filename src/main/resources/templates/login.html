<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
</head>
<body>
    <div style="width:300px; margin:100px auto; border:1px solid #ccc; padding:20px;">
        <h2>Login Page</h2>

        <p th:if="${param.error}" style="color:red;">Invalid username or password</p>
        <p th:if="${param.logout}" style="color:green;">You have been logged out</p>
        <p th:if="${param.registered}" style="color:green;">Registration successful! Please login</p>

        <form th:action="@{/login}" method="post">
            <label>User Name:</label><br>
            <input type="text" name="username" style="width:100%;"/><br><br>

            <label>Password:</label><br>
            <input type="password" name="password" style="width:100%;"/><br><br>

            <button type="submit" style="width:100%; background:#4CAF50; color:white; padding:10px;">Login</button>
        </form>

        <br>
        <a th:href="@{/register}">New user? Register here</a>
    </div>
</body>
</html>
