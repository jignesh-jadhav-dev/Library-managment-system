<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <div class="card card-md details">
        <h2 class="center">Book Details</h2>

        <h3 th:text="${book.title}">Title</h3>
        <p><strong>Author:</strong> <span th:text="${book.author}">Author</span></p>
        <p><strong>Description:</strong> <span th:text="${book.description}">Description</span></p>

        <div class="link-center">
            <a th:href="@{/books}">Back to Book List</a>
        </div>
    </div>
</div>
</body>
</html>
