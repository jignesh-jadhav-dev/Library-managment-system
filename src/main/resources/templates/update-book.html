<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Book</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <div class="card card-md">
        <h2 class="center">Update Book</h2>

        <form th:action="@{/books/edit/{id}(id=${book.id})}" th:object="${book}" method="post">
            <label>Book ID:</label>
            <input type="text" th:field="*{id}" readonly="readonly"/>

            <label>Title:</label>
            <input type="text" th:field="*{title}"/>
            <span class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>

            <label>Author:</label>
            <input type="text" th:field="*{author}"/>
            <span class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>

            <label>Description:</label>
            <textarea th:field="*{description}"></textarea>

            <button type="submit" class="btn btn-green">Update Book</button>
        </form>

        <div class="link-center">
            <a th:href="@{/books}">Back to Book List</a>
        </div>
    </div>
</div>
</body>
</html>
