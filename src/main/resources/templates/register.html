
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
</head>
<body>
    <div style="width:300px; margin:80px auto; border:1px solid #ccc; padding:20px;">
        <h2>Registration</h2>

        <p th:if="${error}" th:text="${error}" style="color:red;"></p>

        <form th:action="@{/register}" th:object="${user}" method="post">

            <label>User Name:</label><br>
            <input type="text" th:field="*{username}" style="width:100%;"/><br>
            <span th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color:red;"></span><br><br>

            <label>Password:</label><br>
            <input type="password" th:field="*{password}" style="width:100%;"/><br>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color:red;"></span><br><br>

            <label>Email:</label><br>
            <input type="text" th:field="*{email}" style="width:100%;"/><br>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color:red;"></span><br><br>

            <label>Full Name:</label><br>
            <input type="text" th:field="*{fullName}" style="width:100%;"/><br>
            <span th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" style="color:red;"></span><br><br>

            <button type="submit" style="width:100%; background:#337ab7; color:white; padding:10px;">Register</button>
        </form>

        <br>
        <a th:href="@{/login}">Already have an account? Login here</a>
    </div>
</body>
</html>
