<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <div class="card card-sm" style="margin-top:40px;">
        <h2>Registration</h2>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <label>Username:</label>
            <input type="text" th:field="*{username}"/>
            <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>

            <label>Password:</label>
            <input type="password" th:field="*{password}"/>
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

            <label>Email:</label>
            <input type="text" th:field="*{email}"/>
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

            <label>Full Name:</label>
            <input type="text" th:field="*{fullName}"/>
            <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>

            <button type="submit" class="btn btn-blue">Register</button>
        </form>

        <div class="link-center">
            <a class="link-blue" th:href="@{/login}">Already have an account? Login here</a>
        </div>
    </div>
</div>
</body>
</html>
